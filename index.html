<!DOCTYPE html>
    <header>
        <link rel="stylesheet" href="main.css">
    </header>
    <body>
        <div id="control-box" class="control-box">
            <div id="gameStart" class="control-group">
                <button id="2Game">Start 2 player game</button>
                <button id="3Game">Start 3 player game</button>
                <button id="4Game">Start 4 player game</button>
            </div>
            <div class="control-group" id="objective-cards">
                <div id="object-card-title" style="grid-column: span 2;">
                    <p>Active Objective Cards:</p>
                </div>
                <div id="object-card-reset" style="grid-column: span 2">
                    <button id="resetObjectiveCards">Activate all Objective Cards</button>
                </div>
            </div>
            <div id="modal-controls" class="control-group">
                <div>
                    <label for="hideObjectiveCards">Hide Objective Cards on Hover?</label>
                    <input id="hideObjectiveCards" type="checkbox">
                </div>
                <div>
                    
                </div>
                <div>
                    <label for="safeModeCheck">Safe Mode?</label>
                    <input id="safeModeCheck" type="checkbox" checked>
                </div>
            </div>
        </div>
        <main id="main">
            <canvas id="board" width="700" height="700"></canvas>
            <div id="gameState">
                
                <p id="turnIndicator">Someone's Turn</p>
                <p id="deckIndicator">X Tiles Unseen</p>

                <p id="boardIndicator">X Tiles Placed</p>
                <p id="scoreIndicator">Total (Marked) Score: XX</p>
                <p id="objectiveInformer">Objective Cards: Hover your Hand</p>
            </div>
            <div id="hands"></div>
            <!-- <canvas id="hand0" width="500", height="100" style="float: left; border: 1px solid #000000; margin: 1em;"></canvas> -->
        </main>
    </body>
    <footer>
        <script src="Board.js"></script>
        <script src="Tile.js"></script>
        <script src="RunGame.js"></script>
    </footer>
</html>
